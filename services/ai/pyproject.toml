[project]
name = "unperformed-ai"
version = "0.1.0"
description = "Optional Live AI service for UNPERFORMED: structured creative interpretation and negotiation via the Claude API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3,<3",
  "fastapi>=0.115",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unperformed_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["unperformed_ai"]
plugins = ["pydantic.mypy"]

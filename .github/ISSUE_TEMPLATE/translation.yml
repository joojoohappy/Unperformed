name: Translation / 翻譯
description: A wrong, awkward or missing translation. / 翻譯錯誤、不自然或缺漏。
labels: [i18n]
body:
  - type: input
    id: where
    attributes:
      label: Where / 位置
      placeholder: "apps/web/src/i18n/zh-TW.ts: negotiate.climax.proposal, or docs/zh-TW/architecture.md"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Current text and suggestion / 目前文字與建議
    validations:
      required: true
